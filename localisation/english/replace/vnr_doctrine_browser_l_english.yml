l_english:
 VNR_DB_TITLE: "Naval Doctrine Guide"
 VNR_DB_OPEN: "Browse naval doctrine branches"
 VNR_DB_INTRO: "Browse any grand doctrine to see its five tracks and associated subdoctrines."
 VNR_DB_RULES: "Reference only. Fleet, technology, industry, XP and mastery requirements still apply."
 VNR_DB_LEGEND: "Branches show alternatives within each track, not a research sequence. * Requires DLC; hover for details.\nDoctrines with upward arrows is faster to achieve. Doctrines with downward arrows is slower to achieve."
 VNR_DB_BACK: "Back"
 VNR_DB_DLC: "Requires DLC: §HNo Compromise, No Surrender§!"
 VNR_DB_NODE_fast_battleship_primacy: "§HFast Battleship Primacy§!\n\nFast battleships set the pace, and their heavy cruisers learn to keep station beside them. Formation drills bring more ships into action at the opening of battle, keep the line together after a long approach, and make the heavy guns more accurate.\n\n§CAdditional requirements:§!\nFleet: Heavy hull ships > 3"
 VNR_DB_NODE_battlecruiser_supremacy: "§HSpecialized Scouting Fleet§!\n\nIn the tradition of the scouting squadrons, battlecruisers and heavy cruisers range ahead to find the enemy while the battle line readies its guns. Better scouting and signals help the fleet form up sooner, and fast divisions can break contact more readily or work together against merchant traffic.\n\n§CAdditional requirements:§!\nFleet: Battlecruiser > 1\nFleet: Battleship > 1"
 VNR_DB_NODE_battleship_antiair_screen: "§HTaskforce Guardian§!\n\nBattleships and heavy cruisers take station around the carriers, bringing their antiaircraft batteries to bear together. Repeated formation drills keep the heavy ships in good order under attack, sharpen their main-battery fire and make the force less vulnerable to crippling torpedo hits.\n\n§CAdditional requirements:§!\nFleet: Heavy hull ships > 3\nTechnology: Aviation Dawn"
 VNR_DB_NODE_armored_raiders: "§HArmored Raiders§!\n\nLong-legged capital ships follow the trade routes, where escorts have little to answer a heavy salvo. Better lookouts and careful handling help scattered raiders find and converge on convoys, slip away when warships intervene, and operate with only a thin screen.\n\n§CAdditional requirements:§!\nAny of:\n  Fleet: Battleship > 0\n  Fleet: Battlecruiser > 0\n  Fleet: Heavy Capital Cruiser > 0"
 VNR_DB_NODE_coastal_defence_fleet: "§HCoastal Defense Fleet§!\n\nIn home waters, minefields and mixed squadrons cover the approaches to port. Heavy cruisers keep better order on escort duty, while purpose-built coast-defense ships gain sturdier fittings and better close-range batteries. The heavy ships work closer to base and can make do with fewer stores."
 VNR_DB_NODE_naval_gunfire_support: "§HMonitor Support§!\n\nIn the tradition of the monitor, heavy guns are brought close inshore to soften beach defenses. Minesweepers clear the approaches, and closer coordination with the army brings landings to readiness sooner. This specialization leaves the heavy ships less suited to fighting an enemy battle line.\n\n§YRequires DLC: §HNo Compromise, No Surrender§!§!"
 VNR_DB_NODE_carrier_battlegroups: "§HCarrier Taskforce§!\n\nA fast carrier task force can search farther from base and strike as soon as its scouts find the enemy. Practiced deck crews keep tightly packed air groups flying at a faster pace, and strike leaders direct their squadrons more accurately onto ships at sea and press home heavier attacks on ports.\n\n§CAdditional requirements:§!\nFleet: Carrier > 3"
 VNR_DB_NODE_floating_airfields: "§HFloating Airfields§!\n\nIn the fleet-carrier tradition, the flight deck furnishes an umbrella of fighters over the fleet. Protected hangars and better shipboard antiaircraft fire keep the carrier in action, while practiced fighter squadrons scramble more readily and deck crews can sustain flying after dark.\n\n§CAdditional requirements:§!\nFleet: Carrier > 3"
 VNR_DB_NODE_subsidiary_carrier_support: "§HSubsidiary Carrier Support§!\n\nCarriers assigned to escort duty use their lookouts and patrol aircraft to find surface ships and submarines. Ready fighters and shipboard guns cover the fleet, while the carriers burn less fuel and work closer to base, where they can keep watch over the convoys.\n\n§CAdditional requirements:§!\nTechnology: Early Carrier Hull\nFleet: Carrier > 0"
 VNR_DB_NODE_carrier_concentration: "§HCarrier Concentration§!\n\nSeveral flight decks send their air groups against a single objective. Concentrated strikes hit harder, especially against ships caught in port, while practiced rearming and deck handling let the carriers send up larger waves in quick succession.\n\n§CAdditional requirements:§!\nFleet: Carrier > 5"
 VNR_DB_NODE_naval_airforce: "§HAir Over Sea§!\n\nLong-range naval bombers turn coastal airfields into bases for striking at sea. Their crews search farther and attack ships with greater accuracy even in poor weather. Carriers keep a low profile and can break contact faster when an enemy surface force closes.\n\n§CAdditional requirements:§!\nTechnology: Early Carrier Hull"
 VNR_DB_NODE_airspace_denial: "§HAirspace Denial§!\n\nCarriers work near island airfields, where their scouts help locate ships and submarines and their fighters can maintain a stronger patrol. Shore-based naval bombers extend that umbrella out to sea, striking harder over a wider area and reaching ships in harbor.\n\n§CAdditional requirements:§!\nFleet: Carrier > 0"
 VNR_DB_NODE_covert_oceanic_replenishment: "§HCovert Oceanic Replenishment§!\n\nDisguised tenders keep distant squadrons supplied along quiet routes, and better-armed auxiliaries can fight back when challenged. Merchantmen are harder to spot and quicker to scatter, while economy in fuel and stores lets the fleet work farther from port.\n\n§CAdditional requirements:§!\nTechnology: Naval Logistics"
 VNR_DB_NODE_industrialized_naval_logistics: "§HIndustrialized Naval Logistics§!\n\nThe industrialization of naval logistics can provide the fleet with a consistent and reliable supply of fuel, ammunition, and spare parts. An expanding chain of forward bases and repair facilities put damaged warships back to sea sooner.\n\n§CAdditional requirements:§!\nTechnology: Naval Logistics\nAny of:\n  Naval dockyards > 49\n  Civilian factories > 39"
 VNR_DB_NODE_trade_supply_network: "§HTrade & Supply Network§!\n\nShared shipping and fuel reserves keep ports and squadrons supplied along the same trade routes. Licensed production moves faster and yards turn out cheaper merchantmen. Better-armed, sturdier freighters are easier to cover and quicker to scatter when raiders break into the convoy.\n\n§CAdditional requirements:§!\nTechnology: Naval Logistics"
 VNR_DB_NODE_centralized_logistics_planning: "§HCentralized Logistics Planning§!\n\nA central staff directs fuel and stores to the squadrons that need them, extending their reach and easing the load on forward bases. Dispersed sailings make convoys harder to find, but also harder to escort.\n\n§CAdditional requirements:§!\nTechnology: Naval Logistics\n\n§YRequires DLC: §HNo Compromise, No Surrender§!§!"
 VNR_DB_NODE_defensive_combat_support: "§HDefensive Combat Support§!\n\nLocal depots, repair crews and dual-purpose ports keep home waters supplied and return damaged warships to duty sooner. Coastal forts go up faster, are easier to restore and put up a stronger defense.\n\n§CAdditional requirements:§!\nTechnology: Naval Logistics"
 VNR_DB_NODE_convoy_escort: "§HConvoy Escort§!\n\nThe convoy is the escort commander's first charge. Destroyers and light cruisers cover more merchantmen and help them scatter faster under attack. Their lookouts find raiders above and below the surface, their guns meet aircraft with heavier fire, and minesweeping patrols keep the lanes open.\n\n§CAdditional requirements:§!\nFleet: Screen ships > 9"
 VNR_DB_NODE_support_integrated_operations: "§HIntegrated Operations§!\n\nDestroyers and light cruisers serve as the fleet's outer screen, ranging farther to give early warning of ships and submarines. They keep a tighter cordon around the heavy ships, meet air attacks with steadier fire, and recover more sailors when ships are hit or sunk.\n\n§CAdditional requirements:§!\nFleet: Light Cruiser > 3\nFleet: Destroyer > 9"
 VNR_DB_NODE_hunter_killers: "§HHunter Killer Groups§!\n\nEscort groups take the hunt to the submarines. Destroyers and light cruisers learn to find submerged boats and press home more damaging attacks, while the convoy they cover can clear the danger more quickly.\n\n§CAdditional requirements:§!\nFleet: Screen ships > 9\nTechnology: Sonar"
 VNR_DB_NODE_torpedo_primacy: "§HTorpedo Flotilla§!\n\nIn the tradition of the torpedo flotillas, destroyers and cruisers deliver heavier, more accurate spreads. Crews reload faster for a second salvo, and night training helps them find the enemy and fight effectively after dark.\n\n§CAdditional requirements:§!\nFleet: Screen ships > 9\nTechnology: Basic Torpedo"
 VNR_DB_NODE_jeune_ecole: "§HThe New School§!\n\nThe French Jeune Ecole sends light cruisers and destroyers after merchant traffic, where they can converge on a convoy quickly. Torpedoes are more likely to get through the enemy screen, while quicker minelaying and more damaging minefields make the coast a difficult place for a battle fleet.\n\n§CAdditional requirements:§!\nFleet: Screen ships > 9\nTechnology: Basic Torpedo"
 VNR_DB_NODE_mosquito_fleet: "§HMosquito Fleet§!\n\nCheap, low-silhouette craft can muster quickly, fire frequent torpedo spreads through an enemy screen and break away before the heavier ships reply. They trade gun power, staying power and the ability to screen a battle line for the strength of a massed attack.\n\n§CAdditional requirements:§!\nTechnology: Basic Torpedo"
 VNR_DB_NODE_wolfpacks: "§HWolfpacks§!\n\nSubmarines spread across the trade routes until a contact report calls the pack together. The boats find convoys sooner, converge faster and deliver more accurate torpedo attacks. They are less likely to give themselves away when they fire and can withdraw more quickly after the attack.\n\n§CAdditional requirements:§!\nFleet: Submarine > 9\nTechnology: Basic Submarine Hull"
 VNR_DB_NODE_submarine_fleet_operations: "§HFleet Operations§!\n\nSubmarines patrol beyond the surface scouts as a distant line of pickets. Longer patrols and sharper lookouts give the fleet earlier warning of enemy ships. They can ambush with more accurate torpedoes, slip away sooner and regroup for attacks on passing convoys.\n\n§CAdditional requirements:§!\nFleet: Submarine > 9"
 VNR_DB_NODE_capital_hunters: "§HCapital Hunters§!\n\nSubmarines take station where an enemy battle line is expected to pass. Their torpedoes hit harder and more accurately at ships behind the screen. Firing is less likely to give the boats away, and crews can reload or slip clear more quickly.\n\n§CAdditional requirements:§!\nFleet: Submarine > 9"
 VNR_DB_NODE_submarine_coastal_defense: "§HShallow Killers§!\n\nSmall boats patrol familiar shallows, where they can find ships more readily and spend less fuel on short sorties. Sturdier midget submarines can stand up to more punishment, and practiced crews fire harder-hitting torpedoes, reload quickly and slip away before the pursuers close in.\n\n§CAdditional requirements:§!\nFleet: Submarine > 0\nTechnology: Midget Submarines"
 VNR_DB_NODE_submarine_area_denial: "§HCovert Denial§!\n\nQuiet diesel-electric boats and denser, more dangerous minefields make the approaches costly to enter. Low-echo hulls and electric torpedoes help the boats keep their whereabouts secret, though the boats have a shorter reach and their torpedoes are less accurate and do less damage.\n\n§CAdditional requirements:§!\nFleet: Submarine > 9"
 VNR_DB_NODE_operation_autonomy: "§HOperational Autonomy§!\n\nSkippers on distant patrols can act on a convoy sighting without waiting for orders. Radio silence makes their boats harder to find, and discreet tenders and frugal cruising extend their patrols. Independent boats can still gather for a merchant raid and place their torpedoes more accurately.\n\n§CAdditional requirements:§!\nFleet: Submarine > 0"
 VNR_DB_GRAND_new_fleet_in_being: "§HDecisive Battle§!\n\nThe battle fleet stays in readiness until it can meet the enemy in strength. Drilled formations keep battleships and battlecruisers in good order and help the whole fleet take station under fire. With practice, the capital ships reach the battle line in better order and bring heavier fire to bear.\n\nBrowse any grand doctrine to see its five tracks and associated subdoctrines."
 VNR_DB_GRAND_new_convoy_raiding: "§HCommerce Raiding§!\n\nThe shipping lanes are the enemy's lifeline. Submarines keep their cohesion on the hunt, converge on convoys sooner and learn to strike with less warning. Distant raiders can stay on station with less fuel, and their heavy ships can operate with a smaller escort.\n\nBrowse any grand doctrine to see its five tracks and associated subdoctrines."
 VNR_DB_GRAND_new_base_strike: "§HAir-Sea Operations§!\n\nThe fleet takes its striking power wherever its carriers can reach. Well-drilled air groups keep flying through a long engagement and hit harder at ships moored in harbor. As the fleet grows accustomed to working around its carriers, steadier screens and faster deck crews keep more aircraft in action.\n\nBrowse any grand doctrine to see its five tracks and associated subdoctrines."
 VNR_DB_GRAND_new_littoral_defense: "§HLittoral Defense§!\n\nA small navy keeps close to familiar shores, where its ships are harder to find. Night lookouts and concealed submarine attacks make the approaches dangerous, while nearby yards restore damaged ships sooner and coastal squadrons can break contact more readily.\n\nBrowse any grand doctrine to see its five tracks and associated subdoctrines."
