l_english:
 naval_develop_category: "Naval Development"
 gen_naval_hire_designer: "Hire Foreign Naval Designers"
 gen_naval_hire_designer_desc: "Our navy is still small. Hiring foreign naval designers will lay the foundation for our future shipbuilding industry."
 gen_naval_hire_advisor: "Hire Foreign Naval Advisors"
 gen_naval_hire_advisor_desc: "Our navy is still small. Hiring some foreign naval advisors will help develop a new generation of naval specialists"
 gen_naval_develop_destroyer: "Purchase Destroyer Blueprints"
 gen_naval_develop_destroyer_desc: "Destroyers are the cornerstone of the navy. Importing their blueprints will help us close the gap with more advanced naval powers."
 gen_naval_develop_cruiser: "Purchase Cruiser Blueprints"
 gen_naval_develop_cruiser_desc: "Cruisers are versatile warships in the navy. Importing their blueprints will help us close the gap with more advanced naval powers."
 gen_naval_develop_battleship: "Purchase Battleship Blueprints"
 gen_naval_develop_battleship_desc: "Battleships are symbols of sea power. Importing their blueprints will help us close the gap with more advanced naval powers."
 gen_naval_develop_carrier: "Purchase Carrier Blueprints"
 gen_naval_develop_carrier_desc: "Carriers have proved to be the future of naval combat. Importing their blueprints will help us close the gap with more advanced naval powers."
 gen_naval_develop_submarine: "Purchase Submarine Blueprints"
 gen_naval_develop_submarine_desc: "Submarines are deadly predators below the surface. Importing their blueprints will help us close the gap with more advanced naval powers."
 gen_naval_research_budget: "Increase Naval R&D Budget"
 gen_naval_research_budget_desc: "We need to invest more money in improving our naval technologies."
 vnr_research_budget: "Naval R&D Investment"
 wartime_convoy_conversion: "Merchant Carrier Conversion"
 wartime_convoy_conversion_desc: "We can purchase a merchantman from private owners and convert it into an aircraft carrier."
 wartime_carrier_conversion_tt_1: "§GAn aircraft carrier will be converted in 2 months.§!\n\nUnlocks §YMerchant carrier§! technology.\n"
 wartime_liner_conversion: "Escort Carrier Conversion"
 wartime_liner_conversion_desc: "We can purchase a passenger liner from private owners and convert it into an aircraft carrier."
 wartime_carrier_conversion_tt_2: "§GAn aircraft carrier will be converted in 3 months.§!\n\nUnlocks §YEscort carrier§! technology.\n"
 super_heavy_carrier_conversion: "Finalize Super Heavy Carrier Conversion Proposal"
 super_heavy_carrier_conversion_desc: "With at least one super heavy battleship in active service, the naval design team has proposed conversion of super-heavy battleships with ample space into carriers.\n\nUnlocks §YConverted Battleship Hull§!.\nUnlocks §YSuper Heavy Battleship Origin§! (Module) on §YConverted Battleship Hull§!.\n"

 # officer corps spirits
 etajima_naval_academy: "Naval Academy Etajima"
 etajima_naval_academy_desc: "The Imperial Japanese Naval Academy was founded in Nagasaki in 1866, and moved to Etajima in 1888. It is one of the most famous naval colleges in the world, cultivating hundreds of experienced naval officers for the Japanese Navy every year."
 annapolis_naval_academy: "Annapolis Naval Academy"
 annapolis_naval_academy_desc: "Located in Annapolis, Maryland, the US Naval Academy has a history dating to 1845. The school encourages cadets to establish strategic visions around seapower through comprehensive courses on naval tactics and technologies."
 dartmouth_naval_academy: "Britannia Royal Naval College"
 dartmouth_naval_academy_desc: "Established in 1905 with long-standing traditions and prestige, the Britannia Royal Naval Academy in Dartmouth has been a symbol of British armed forces for years."
 panama_standard: "Panama Standard"
 panama_standard_desc: "To maintain a presence in both oceans, the United States Navy relied heavily on the Panama Canal to transfer its fleet between them. Because of the canal's geographical limits, ships should not be wider than 110 ft, thus influencing all America's battleship designs."
 kiel_standard: "Kiel Standard"
 kiel_standard_desc: "As a shortcut to bypass the Belts, the Kiel Canal is an important lifeline to the German Reich. With limitation on draft in the Canal, German battleships need to be made wider in order to increase buoyancy, but it often leads to extra armor and heavier hull without actual use."
 professional_damage_control: "Professional Damage Control"
 professional_damage_control_desc: "A trained damage control team can save the ship in the most dangerous situations."
 advanced_supply_fleet: "Advanced Supply Fleet"
 advanced_supply_fleet_desc: "An advanced fleet of replenishment oilers and auxiliary ships will keep our fleet operating at full capacity."
 underwater_death: "Submarine Warfare"
 underwater_death_desc: "Although not widely accepted, submarines have the potential to cripple a country's trade and economy during wartime."
 efficient_escort: "Efficient Escorts"
 efficient_escort_desc: "Our destroyers and frigates must be capable of protecting fleets and convoys."
 merchant_fleet: "Merchant Fleet"
 merchant_fleet_desc: "Merchant ships are instruments of trade and diplomacy as well as potential auxiliaries in wartime."
 inflexible_headquarter: "Inflexible Headquarter"
 inflexible_headquarter_desc: "Our naval headquarters is staffed by senior officers who remain committed to outdated doctrines from previous wars."
 win_or_die: "Win or Die"
 win_or_die_desc: "We shall win or die trying."
 recovering_from_naval_race: "Recovering from Naval Race"
 recovering_from_naval_race_desc: "Our navy is still recovering from an unsustainable naval arms race, whose legacy continues to burden its shipbuilding and design efforts."
 recovering_from_naval_race_tt: "Only available in KR/KX Naval Rework."
 lack_maintenance_facilities: "Out of Maintenance"
 lack_maintenance_facilities_desc: "Our naval facilities are insufficient to maintain a fleet of our present size."
 murwik_naval_academy: "Marineschule Mürwik"
 murwik_naval_academy_desc: "Mürwik Naval Academy, or Marineschule Mürwik in German, is the main training establishment for all German Navy officers as the successor to the Imperial Naval Academy of 1910. The institution aims at professionalizing German naval officers through weapon systems training and naval engineering education."
 voroshilov_naval_academy: "K.E. Voroshilov Naval Academy"
 voroshilov_naval_academy_desc: "As one of the most famous naval war colleges in the world, this institution was established to succeed the Nikolayev Naval Academy in the wake of the February Revolution. Hundreds of experienced cadets with strategic visions start their careers from here every year, eager to serve Mother Russia."
 nakhimov_naval_academy: "Nakhimov Naval Academy"
 nakhimov_naval_academy_desc: "As one of the most famous naval war colleges in the world, this institution was established to succeed the Nikolayev Naval Academy in the wake of the February Revolution. Hundreds of experienced cadets with strategic visions start their careers from here every year, eager to serve Mother Russia."
 usn_fighter_weapons_school: "TOPGUN"
 usn_fighter_weapons_school_desc: "The USN Fighter Weapons School, commonly referred to as the TOPGUN, is a U.S. Navy program that provides air combat training for naval aviators to create not basic pilots, but experienced instructors. Its demanding courses about aerodynamics and combat tactics have promoted these cadets to the best of the best."

 ## special projects
 sp_battlecarrier: "Battlecarrier"
 sp_battlecarrier_desc: "A battlecarrier combines battleship armament and protection with an aircraft carrier's flight deck and aircraft capacity. The idea has been proposed by some naval architects from multiple countries with emphasis on both kinds of ships."
 sp_subcarrier: "Subcarrier"
 sp_subcarrier_desc: "A subcarrier is actually a large submarine capable of launching planes. Despite lighter and smaller planes, it is not easy to accommandate them inside narrow space of submarines, which makes subcarrier's capacity limited to roughly two."
 sp_nuclear_torpedo: "Nuclear Torpedo"
 sp_nuclear_torpedo_desc: "Underwater nuclear blast can be deadly to surface vessels and submarines. A nuclear warhead carried by a torpedo would become one of the most powerful submarine weapons ever deployed."
 sp_super_heavy_guns: "Super Heavy Naval Gun"
 sp_super_heavy_guns_desc: "A super-heavy naval gun has a caliber of more than 18 inches (460 mm)."
 sp_mega_carrier: "Strategic Strike Carrier"
 sp_mega_carrier_desc: "A strike carrier is a floating airfield capable of launching heavy jet aircraft at long range."
 sp_arsenal_ship: "Arsenal Ship"
 sp_arsenal_ship_desc: "As missiles gained prominence as a future weapon system, naval designers proposed an arsenal ship carrying hundreds of launch bays."
 sp_early_informatization_system: "Early Informatization System"
 sp_early_informatization_system_desc: "As naval warfare becomes more dependent on rapid sensing and data processing, informatization is presented as the path to victory in the coming decades."
 sp_high_speed_light_engine: "High Speed Light Engine"
 sp_high_speed_light_engine_desc: "A combination of high-temperature superheaters and powerful steam turbines could accelerate the ship to unprecedented speeds."
 sp_submarine_snorkel: "Submarine Snorkel"
 sp_submarine_snorkel_desc: "A submarine snorkel is a device which allow the engine to run submerged and supply air from above the surface."
 sp_shipping_container: "Shipping Container"
 sp_shipping_container_desc: "A standard-size metal container that can be transported by ship or vehicle, maximizing efficiency in both military logistics and industry."

 sp_battlecarrier_unique_reward_a: "Debate over Battlecarrier's Role"
 sp_battlecarrier_unique_reward_a_desc: "During the iteration process of battlecarrier, a question is raised. Should we focus on its performance or coordination with other ships?"
 sp_battlecarrier_perference_a: "Performance"
 sp_battlecarrier_perference_b: "Coordination"
 sp_subcarrier_unique_reward_a: "Application of Engineering Experience"
 sp_subcarrier_unique_reward_a_desc: "During the iteration process of subcarrier, a question is raised. Should we use the experience on cruiser submarine alone or all types of submarines?"
 sp_subcarrier_perference_a: "Cruiser Submarine"
 sp_subcarrier_perference_b: "All Submarines"
 sp_nuclear_torpedo_unique_reward_a: "Orientation of Nuclear Torpedo Project"
 sp_nuclear_torpedo_unique_reward_a_desc: "The safety of nuclear warhead storage on submarine remains a question."
 sp_nuclear_torpedo_preference_a: "Safety First"
 sp_nuclear_torpedo_preference_b: "Expanded Storage"
 sp_super_heavy_guns_unique_reward_a: "Pursuit of 20-in Gun"
 sp_super_heavy_guns_unique_reward_a_desc: "In the development of super heavy naval guns, an even wilder idea has been proposed to fund research of bigger guns. If we choose to pursue breakthrough in it, the current progress will be affected."
 sp_super_heavy_guns_preference_a: "Granted"
 sp_super_heavy_guns_preference_b: "Forget it"
 sp_early_informatization_system_unique_reward_a: "Informatization Effort"
 sp_early_informatization_system_unique_reward_a_desc: "The leading R&D team in computer science has proposed a project to expand informatization system and merge all electronic devices units of naval vessels into a collective computer system. It's an interesting idea but will greatly slow down the original program."
 sp_early_informatization_system_perference_a: "Keep it moderate."
 sp_early_informatization_system_perference_b: "Spare some budgets."
 sp_naval_proximity_fuze_unique_reward_a: "Usage of Proximity Fuze"
 sp_naval_proximity_fuze_unique_reward_a_desc: "Proximity fuze has largely promoted anti-air shells to be more efficient in hitting planes, but it brings increase of cost in manufacture. We can focus the production for dedicated anti-air ships, or bear the cost and make the advantage universal."
 sp_naval_proximity_fuze_preference_a: "Anti-Air Ships Priority"
 sp_naval_proximity_fuze_preference_b: "Universal Advantage"

 vnr_special_project_workaround_tt: "This §Yspecial project§! §Rdoes not exist§! in the Naval Rework series, it is kept to §Yavoid foci or decisions requiring it from being inaccessible§!.\n\nTo get this project for foci/decision unlocking, research $TECH|Y$ in the §Ctechtree§!."